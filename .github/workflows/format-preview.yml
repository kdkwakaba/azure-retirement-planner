name: Temporary format preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write packages/adapters/src/azure.ts packages/domain/src/index.ts
      - name: Emit formatted sources
        run: |
          for file in packages/adapters/src/azure.ts packages/domain/src/index.ts; do
            echo "FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
