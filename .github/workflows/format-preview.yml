name: Temporary format preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/domain.test.ts
      - name: Emit formatted source
        run: |
          echo "FORMAT_BEGIN:tests/domain.test.ts"
          base64 -w0 tests/domain.test.ts
          echo
          echo "FORMAT_END:tests/domain.test.ts"
